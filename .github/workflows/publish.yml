# When you publish a GitHub Release with a mod .zip attached (or the helper .exe on a helper-v* tag),
# this adds it to docs/mods.json so it shows up on the site and the helper can install it.
name: Publish to mod site

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)publish
        required: true

permissions:
  contents: write

concurrency:
  group: mod-index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p dl
          if [[ "$TAG" == helper-v* ]]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.exe' --dir dl
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir dl
          fi
          ls -la dl
          count=$(ls dl | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Attach exactly one .zip (or one .exe for helper-v* tags) to the release. Found $count."
            exit 1
          fi

      - name: Update mods.json
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 tools/update_index.py --tag "$TAG" --file "dl/$(ls dl)"

      - name: Commit
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          rm -rf dl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Publish $TAG"
          git push
